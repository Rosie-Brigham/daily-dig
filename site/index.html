<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Daily Dig</title>
  <meta name="description" content="A small daily batch of history snippets from Wikipedia.">
  <meta name="theme-color" content="#f4eee3" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#14110d" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Daily Dig">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,650;1,9..144,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Inter:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">Daily Dig</div>
    <nav class="tabs" role="tablist">
      <button class="tab is-active" data-view="today" role="tab" aria-selected="true">Today</button>
      <button class="tab" data-view="saved" role="tab" aria-selected="false">Saved</button>
    </nav>
    <div class="progress" aria-live="polite"><span class="progress-text"></span><span class="progress-bar"><span></span></span></div>
  </header>

  <main id="feed" class="feed" aria-label="Posts"></main>

  <script src="app.js" type="module"></script>
</body>
</html>
